name: Windows downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build dependencies
        run: python -m pip install -r build-requirements.txt

      - name: Generate workbook
        run: python generate_master_plan.py

      - name: Package Windows application
        run: pyinstaller --noconfirm --clean --onefile --name AI_x_3D_Oyun_Motoru generate_master_plan.py

      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: windows-11-x64-downloads
          path: |
            dist/AI_x_3D_Oyun_Motoru.exe
            AI_x_3D_Oyun_Motoru_Master_Plan.xlsx
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: windows-11-x64-downloads
          path: release-files

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
